name: Release Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Bump Version & Open Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Bump package.json version
        id: version
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VER="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const header = '# Changelog\n\n## [' + '$VER' + '] - ' + '$DATE' + '\n\n### Changed\n- Cierre de hito y actualización de versión a v' + '$VER' + '.\n\n';
            fs.writeFileSync('CHANGELOG.md', content.replace('# Changelog\n\n', header));
          "

      - name: Create Release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          BRANCH="chore/CVC-0-release-v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): bump version to v$VER CVC-0"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump version to v$VER CVC-0" \
            --body "Automated milestone release PR for **v$VER**."
